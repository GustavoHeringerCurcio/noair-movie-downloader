name: movie-downloader

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: moviedl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d moviedl"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  qbittorrent:
    image: linuxserver/qbittorrent
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
    volumes:
      - qbconfig:/config
      - downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks: [internal]

  prowlarr:
    image: linuxserver/prowlarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      # Used by deploy/prowlarr-api-key.sh (mounted below) to pin the API key in
      # config.xml on every boot, so it can never drift from the backend's
      # PROWLARR_API_KEY when the prowlarr-config volume is recreated.
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:?set PROWLARR_API_KEY in .env}
    volumes:
      - prowlarr-config:/config
      # linuxserver/prowlarr ignores PROWLARR__* env overrides; this init script
      # seeds/patches config.xml before Prowlarr starts.
      - ./deploy/prowlarr-api-key.sh:/custom-cont-init.d/99-prowlarr-api-key.sh:ro
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks: [internal]

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
      TZ: Etc/UTC
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks: [internal]

  backend:
    build: ./backend
    extra_hosts:
      # Some ISP/host DNS servers return a dead BunnyCDN edge for image.tmdb.org
      # (TCP times out). Pin a reachable edge; any BunnyCDN node serves the same images.
      - "image.tmdb.org:152.233.22.97"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in .env}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      FANART_API_KEY: ${FANART_API_KEY:-}
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:?set PROWLARR_API_KEY in .env}
      QBITTORRENT_URL: http://qbittorrent:8080
      QBITTORRENT_USER: ${QBITTORRENT_USER:-admin}
      QBITTORRENT_PASS: ${QBITTORRENT_PASS:?set QBITTORRENT_PASS in .env}
      DATABASE_URL: postgres://app:app@postgres:5432/moviedl
      DOWNLOAD_DIR: /downloads
      PORT: "3000"
      PACKAGE_MAX_BYTES: ${PACKAGE_MAX_BYTES:-53687091200}
      REMOTE_DATA_DIR: /remote
      CLOUDFLARE_TUNNEL_HOSTNAME: ${CLOUDFLARE_TUNNEL_HOSTNAME:-}
      # Optional cap on software-encode threads (e.g. 8) to keep the host
      # responsive while converting; unset = auto (cores, memory-aware).
      CONVERSION_THREADS: ${CONVERSION_THREADS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - downloads:/downloads
      - packages:/packages
      - art:/art
      - remoteaccess:/remote
    restart: unless-stopped
    networks: [internal]

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks: [internal]

  # Remote access: core feature — exposes the frontend publicly over HTTPS via
  # a Cloudflare tunnel so you can watch from a TV/other device. Always started
  # with the rest of the stack. Default = quick tunnel (ephemeral
  # *.trycloudflare.com URL, URL-is-the-secret); set CLOUDFLARE_TUNNEL_TOKEN +
  # CLOUDFLARE_TUNNEL_HOSTNAME to use a named tunnel on your own domain instead.
  cloudflared:
    build:
      context: .
      dockerfile: deploy/cloudflared.Dockerfile
    image: movie-downloader-cloudflared
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      CLOUDFLARE_TUNNEL_HOSTNAME: ${CLOUDFLARE_TUNNEL_HOSTNAME:-}
    volumes:
      - ./deploy/cloudflared-entrypoint.sh:/entrypoint.sh:ro
      - remoteaccess:/data
    depends_on:
      - frontend
    restart: unless-stopped
    networks: [internal]

volumes:
  pgdata:
  qbconfig:
  prowlarr-config:
  downloads:
  packages:
  art:
  remoteaccess:

networks:
  internal:
    driver: bridge
